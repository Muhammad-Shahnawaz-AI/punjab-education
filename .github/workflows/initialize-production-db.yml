name: Initialize production database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Validate production settings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import sys

          required = ("DATABASE_URL", "BOOTSTRAP_ADMIN_EMAIL", "BOOTSTRAP_ADMIN_PASSWORD")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print("Missing required GitHub Actions secrets: " + ", ".join(missing))
              sys.exit(1)
          if not os.environ["DATABASE_URL"].startswith(("postgresql://", "postgresql+psycopg://")):
              print("DATABASE_URL must point to a PostgreSQL database.")
              sys.exit(1)
          if len(os.environ["BOOTSTRAP_ADMIN_PASSWORD"]) < 12:
              print("BOOTSTRAP_ADMIN_PASSWORD must be at least 12 characters.")
              sys.exit(1)
          PY

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head
        working-directory: backend

      - name: Create bootstrap administrator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: python -m app.bootstrap_admin
        working-directory: backend
